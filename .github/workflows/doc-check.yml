name: Doc check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # setup-node looks for the package manager package.json names; install that pinned pnpm first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Test the doc checker
        run: node tools/doc-check/check.mts test
      - name: Run the doc checker
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # A new branch's first push has no "before" commit (all zeros): compare with where it left main.
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
            if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE=$(git rev-parse HEAD~1); fi
          fi
          echo "Base: $BASE"
          node tools/doc-check/check.mts --base "$BASE"
