document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows trusted hosts to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"max-width:1320px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column\">\n      <span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-3);letter-spacing:.04em\">APPAREL OS · DESIGN SYSTEM · REV 4 · 3 OCT 2026<\u002Fspan>\n      <strong style=\"font-size:18px;line-height:24px;font-weight:600\">Design system · Sand &amp; Navy · Source Sans 3<\u002Fstrong>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:4px;flex-wrap:wrap;flex:1\">\n      <a href=\"#tokens\" style=\"padding:6px 10px;border-radius:6px;color:var(--text-2);text-decoration:none\">1 Tokens<\u002Fa>\n      <a href=\"#states\" style=\"padding:6px 10px;border-radius:6px;color:var(--text-2);text-decoration:none\">2 States<\u002Fa>\n      <a href=\"#components\" style=\"padding:6px 10px;border-radius:6px;color:var(--text-2);text-decoration:none\">3 Components<\u002Fa>\n      <a href=\"#shells\" style=\"padding:6px 10px;border-radius:6px;color:var(--text-2);text-decoration:none\">4 Shells<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:12px;line-height:16px;color:var(--text-2)\">{{ themeNow }}<\u002Fspan><div role=\"group\" aria-label=\"Theme\" style=\"display:flex;border:1px solid var(--control);border-radius:6px;overflow:hidden;height:36px\"><sc-for list=\"{{ themeOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.on }}\" style=\"padding:0 12px;border:0;background:{{ o.bg }};color:{{ o.fg }};font-weight:600;cursor:pointer\" style-focus=\"outline:2px solid var(--accent);outline-offset:-4px;box-shadow:inset 0 0 0 2px var(--surface)\">{{ o.short }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\" sc-camel-tab-index=\"-1\" style=\"outline:none;max-width:1320px;margin:0 auto;padding:40px 32px 120px;display:flex;flex-direction:column;gap:72px\">\n\n<section style=\"display:flex;flex-direction:column;gap:12px;max-width:860px\">\n  <h1 style=\"margin:0;font-size:32px;line-height:38px;font-weight:600;letter-spacing:-.01em\">One system, four shells<\u002Fh1>\n  <p style=\"margin:0;font-size:16px;line-height:24px;color:var(--text-2);text-wrap:pretty\">The live version of <a href=\"design-language.md\">design-language.md<\u002Fa>. If the two differ, the design language wins, and the <a href=\"../../prd.md\">PRD<\u002Fa> and <a href=\"../../kdps-policies.md\">KDPS policies<\u002Fa> win over both. It shows these PRD sections: Operator experience; People, access and approvals; Merchandise and identifiers; Receiving and price tickets; Transfers and physical movement; Counter sales and payments; HRMS and payroll; Exceptions, reports and planning; Technical platform (Offline counter); Required policy configuration. Policies: 2 (scope, approval limits), 3 (PT costing), 4 (piece IDs), 6 and 7 (returns, refunds, tenders), 10 (bill number), 16 (offline), 17 (held goods), 19 (offers and promotions). Requirement IDs applied: PRD-ACS-002, PRD-ACS-003, PRD-ACS-009, PRD-ACS-010, PRD-ACS-015, PRD-MER-015, PRD-MER-016, PRD-REC-006, PRD-REC-020 to PRD-REC-022, PRD-PTW-011, PRD-PTW-013, PRD-POS-007, PRD-POS-020, PRD-POS-022, PRD-OFF-001, PRD-OFF-003, PRD-OFF-015, PRD-OFF-017, PRD-OFF-019, PRD-TRF-011, PRD-TRF-013, PRD-HRM-004, PRD-HRM-006, PRD-HRM-007, PRD-LIF-026; POL-02.07 to POL-02.10, POL-04.06, POL-07.09, POL-10.07, POL-16.01 to POL-16.03. People appear as the 14 PRD personas (<a href=\"../access/personas.md\">personas.md<\u002Fa>).<\u002Fp>\n  <p style=\"margin:0;font-size:16px;line-height:24px;color:var(--text-2);text-wrap:pretty\">Everything is built from the tokens in section 1. The theme follows the device by default; the switch at the top right overrides it, like My profile › Theme (3.12). Glass is used only on chrome: the top bar, drawers, popovers and toasts. Tables, forms, the PT grid and the till stay solid. Density is comfortable: 40 px table rows and 36 px controls, with 48 px targets on the till and the portal. Text is English (India) for now; Hindi arrives in stage 5 for stages 1–5 screens and in stage 6 for stage 6 screens.<\u002Fp>\n  <div role=\"note\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);max-width:860px\"><span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--i-bg);color:var(--i-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">◔<\u002Fspan>Test data<\u002Fspan><span style=\"font-size:13px;line-height:18px;color:var(--text-2)\">Sample values on this page (names, dates, rates, limits, times, targets, counters and amounts shown in examples) are synthetic examples. None is a KDPS setting. Values quoted from the PRD or the policies as rules, and design dimensions, are not examples. Approval limits, approvers, GST rates, shifts, close times, the offline counter and the bill number layout are OPEN until the policy that owns them is signed.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tokens\" style=\"display:flex;flex-direction:column;gap:28px;scroll-margin-top:80px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h2 style=\"margin:0;font-size:24px;line-height:30px;font-weight:600\">1 · Tokens<\u002Fh2>\n    <p style=\"margin:0;color:var(--text-2);max-width:820px\">Colour, type, spacing, radius and elevation. Contrast is measured live for every text or control pair. The minimum is 4.5:1 for text and 3:1 for control borders (WCAG 2.2 AA (design target), 1.4.3 and 1.4.11).<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1a · Colour<\u002Fh3>\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto\">\n      <div style=\"min-width:900px\">\n        <div style=\"display:grid;grid-template-columns:170px minmax(0,1.4fr) 170px 170px 150px;gap:12px;padding:10px 16px;background:var(--sunken);font-size:12px;line-height:16px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border)\"><span>Token<\u002Fspan><span>Use<\u002Fspan><span>Light<\u002Fspan><span>Dark<\u002Fspan><span>Contrast L / D<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ colorTokens }}\" as=\"c\" hint-placeholder-count=\"22\">\n          <div style=\"display:grid;grid-template-columns:170px minmax(0,1.4fr) 170px 170px 150px;gap:12px;padding:8px 16px;border-top:1px solid var(--border);align-items:center\">\n            <span style=\"font-family:'Source Code Pro',monospace;font-size:13px\">{{ c.name }}<\u002Fspan>\n            <span style=\"color:var(--text-2)\">{{ c.use }}<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:{{ c.l }}\"><\u002Fspan><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-2)\">{{ c.l }}<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:{{ c.d }}\"><\u002Fspan><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-2)\">{{ c.d }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-2)\">{{ c.cr }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Contrast is measured against the token in brackets. A dash means the token is decorative or a surface. Glass: 70% light and 66% dark surface opacity, 16 px blur, 1.2 saturation, with a 1 px hairline border at 10%. Text on glass always uses the text tokens, because the page underneath is a known solid surface.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1b · Type · Source Sans 3 + Source Code Pro<\u002Fh3>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden\">\n        <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"11\">\n          <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 16px;border-top:1px solid var(--border);align-items:baseline\">\n            <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Source Code Pro',monospace;font-size:12px\">{{ t.name }}<\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">{{ t.spec }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:{{ t.fam }};font-size:{{ t.size }}px;line-height:{{ t.lh }}px;font-weight:{{ t.w }};font-variant-numeric:tabular-nums;overflow-wrap:anywhere\">{{ t.sample }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:var(--text-3)\">The smallest size is 12 px, used only for labels and captions. Numbers in tables, totals and limit bars always use tabular figures. Codes (SKU, barcode, piece ID, doc no., bill no., persona ID) use mono. For Hindi (stage 5, and stage 6 for its screens), Noto Sans Devanagari is next in the font stack; labels, buttons and menus leave room for about 30% longer text.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1c · Spacing · 4 px base<\u002Fh3>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid;grid-template-columns:70px 44px minmax(0,1fr);gap:10px;align-items:center;font-size:13px\">\n              <span style=\"font-family:'Source Code Pro',monospace;font-size:12px\">{{ s.n }}<\u002Fspan>\n              <span style=\"color:var(--text-3);font-variant-numeric:tabular-nums\">{{ s.v }} px<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:10px;border-radius:2px;background:var(--accent);width:{{ s.v }}px;flex-shrink:0\"><\u002Fspan><span style=\"color:var(--text-3);font-size:12px;line-height:16px\">{{ s.use }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1d · Sizes (comfortable density)<\u002Fh3>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden\">\n          <sc-for list=\"{{ sizes }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;padding:7px 16px;border-top:1px solid var(--border);font-size:13px\"><span style=\"color:var(--text-2)\">{{ s.n }}<\u002Fspan><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;text-align:right\">{{ s.v }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1e · Radius &amp; elevation<\u002Fh3>\n    <div style=\"position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--sunken);padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px\">\n      <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--border) 0 1px,transparent 1px 14px);opacity:.7\"><\u002Fdiv>\n      <div style=\"position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:92px\"><strong style=\"font-weight:600\">e0 · Flat<\u002Fstrong><span style=\"font-size:13px;color:var(--text-2)\">Tables, forms, PT grid, till. Border only, radius 6.<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600\">e1 · Card<\u002Fstrong><span style=\"font-size:13px;color:var(--text-2)\">Panels, KPI tiles, approval panel. Radius 8.<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600\">e2 · Menu<\u002Fstrong><span style=\"font-size:13px;color:var(--text-2)\">Dropdowns, date picker, solid popovers. Radius 8.<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--glass-border);border-radius:12px;padding:14px;box-shadow:var(--sh3);display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600\">e3 · Glass<\u002Fstrong><span style=\"font-size:13px;color:var(--text-2)\">Top bar, drawers, scope popover, toasts, modals. Radius 12 (top bar 0).<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Radius scale: 4 (checkbox, keycap) · 6 (inputs, buttons, table frame) · 8 (cards, menus) · 12 (drawers, dialogs) · 999 (badges, chips, counters).<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1f · Formats · English (India)<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px\">\n      <sc-for list=\"{{ formats }}\" as=\"f\" hint-placeholder-count=\"8\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:12px;line-height:16px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em\">{{ f.k }}<\u002Fspan>\n          <span style=\"font-size:18px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums\">{{ f.v }}<\u002Fspan>\n          <span style=\"font-size:13px;color:var(--text-2)\">{{ f.n }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">1g · Numbers in tables<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 170px;height:40px;align-items:center;background:var(--sunken);border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-2)\"><span style=\"padding:0 12px\">Case<\u002Fspan><span style=\"padding:0 12px;text-align:right\">Qty (unit)<\u002Fspan><span style=\"padding:0 12px;text-align:right\">Value (₹)<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ numRows }}\" as=\"n\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 170px;min-height:40px;align-items:center;border-top:1px solid var(--border)\">\n            <span style=\"padding:0 12px;display:flex;flex-direction:column\"><span>{{ n.c }}<\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">{{ n.note }}<\u002Fspan><\u002Fspan>\n            <span aria-label=\"{{ n.qa }}\" style=\"padding:0 12px;text-align:right;font-variant-numeric:tabular-nums\">{{ n.q }}<\u002Fspan>\n            <span aria-label=\"{{ n.va }}\" style=\"padding:0 12px;text-align:right;font-variant-numeric:tabular-nums\">{{ n.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 170px;height:40px;align-items:center;border-top:2px solid var(--control);background:var(--sunken);font-weight:600\"><span style=\"padding:0 12px\">Total (known rows)<\u002Fspan><span style=\"padding:0 12px;text-align:right;font-variant-numeric:tabular-nums\">1,09,660<\u002Fspan><span style=\"padding:0 12px;text-align:right;font-variant-numeric:tabular-nums\">3,46,08,300.00<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:18px;color:var(--text-2)\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px\"><strong style=\"color:var(--text);font-weight:600\">Alignment<\u002Fstrong><span>All numbers are right-aligned with tabular figures, so digits line up by place value. Money always shows two decimals, so the decimal points line up too. Quantities are whole numbers in the product’s stock unit (POL-04.03). In tables the ₹ sign goes in the column header; on records, totals and the till it goes before the number.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px\"><strong style=\"color:var(--text);font-weight:600\">Zero vs blank<\u002Fstrong><span><strong style=\"color:var(--text)\">0<\u002Fstrong> means the value is known to be zero (counted, nothing there). A <strong style=\"color:var(--text)\">blank<\u002Fstrong> cell means the value is unknown; in fields and on records the word <strong style=\"color:var(--text)\">○ Unknown<\u002Fstrong> is shown instead. Screen readers announce it as “unknown”. Totals leave blanks out and a trust chip says so. Dashes are never used for numbers.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px\"><strong style=\"color:var(--text);font-weight:600\">Negatives &amp; crores<\u002Fstrong><span>A true minus sign (−), never brackets and never red alone. Full values use Indian grouping up to crores: 3,41,26,000.00. Compact forms (₹3.41 Cr, ₹12.65 L) are used only on dashboard tiles, and the exact value shows on hover or focus.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"states\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:80px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h2 style=\"margin:0;font-size:24px;line-height:30px;font-weight:600\">2 · State colours<\u002Fh2>\n    <p style=\"margin:0;color:var(--text-2);max-width:840px;text-wrap:pretty\">Seven colour families and {{ stateCount }} states, named as in the PRD and the KDPS policies. The navy accent is reserved for actions and selection, so it never means a state. Every badge carries a word and a shape, so colour is never the only signal (WCAG 1.4.1). A record shows one badge: its lifecycle state. Short and excess are line chips and counts, never a record’s status, because conditions can coexist (PRD-REC-006). A completed bill is never Cancelled or Reversed.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px\">\n    <sc-for list=\"{{ families }}\" as=\"f\" hint-placeholder-count=\"7\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n          <strong style=\"font-weight:600\">{{ f.name }}<\u002Fstrong>\n          <span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--{{ f.k }}-bg);color:var(--{{ f.k }}-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">{{ f.glyph }}<\u002Fspan>{{ f.sample }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:13px;line-height:18px;color:var(--text-2)\">{{ f.mean }}<\u002Fspan>\n        <span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-3)\">--{{ f.k }}-bg / --{{ f.k }}-fg · glyph {{ f.glyph }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto\">\n    <div style=\"min-width:760px\">\n      <div style=\"display:grid;grid-template-columns:230px 130px minmax(0,1fr);gap:12px;padding:10px 16px;background:var(--sunken);font-size:12px;line-height:16px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border)\"><span>State<\u002Fspan><span>Family<\u002Fspan><span>Where it appears<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ stateMap }}\" as=\"s\" hint-placeholder-count=\"46\">\n        <div style=\"display:grid;grid-template-columns:230px 130px minmax(0,1fr);gap:12px;padding:8px 16px;border-top:1px solid var(--border);align-items:center\">\n          <span><span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--{{ s.k }}-bg);color:var(--{{ s.k }}-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">{{ s.glyph }}<\u002Fspan>{{ s.n }}<\u002Fspan><\u002Fspan>\n          <span style=\"color:var(--text-2);font-size:13px\">{{ s.fam }}<\u002Fspan>\n          <span style=\"color:var(--text-2);font-size:13px;line-height:18px\">{{ s.where }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"components\" style=\"display:flex;flex-direction:column;gap:28px;scroll-margin-top:80px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h2 style=\"margin:0;font-size:24px;line-height:30px;font-weight:600\">3 · Components<\u002Fh2>\n    <p style=\"margin:0;color:var(--text-2);max-width:820px\">The table, the scope chip and the theme are live. Try sorting, filtering, selecting rows and paging.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px\">\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.1 · Buttons<\u002Fstrong>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n        <button style=\"height:36px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer\" style-hover=\"background:var(--accent-hover)\" style-focus=\"outline:2px solid var(--accent);outline-offset:2px\">Primary<\u002Fbutton>\n        <button style=\"height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--control);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer\" style-hover=\"background:var(--hover)\">Secondary<\u002Fbutton>\n        <button style=\"height:36px;padding:0 12px;border-radius:6px;border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer\" style-hover=\"background:var(--tint)\">Ghost<\u002Fbutton>\n        <button style=\"height:36px;padding:0 16px;border-radius:6px;border:0;background:var(--danger);color:var(--on-danger);font-weight:600;cursor:pointer\">Reverse PT<\u002Fbutton>\n        <button disabled=\"{{ true }}\" style=\"height:36px;padding:0 16px;border-radius:6px;border:1px dashed var(--control);background:var(--sunken);color:var(--text-3);font-weight:500;cursor:not-allowed\">Disabled<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n        <button style=\"height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-size:13px;font-weight:500\">Small · 28<\u002Fbutton>\n        <button style=\"height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-weight:500\">Default · 36<\u002Fbutton>\n        <button style=\"height:48px;padding:0 20px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600\">Touch · 48<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Each screen has at most one primary button. Destructive actions (reverse, write off, reject) use the solid red and always ask for a reason. Disabled buttons use a dashed border and keep readable text, with a tooltip explaining why.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px\">\n      <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.2 · Chips &amp; counters<\u002Fstrong>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Scope chip · several Stores and brands. Click to open.<\u002Fspan>\n        <div style=\"position:relative;display:flex;gap:8px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ toggleScope }}\" aria-expanded=\"{{ scopeOpen }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:13px;cursor:pointer\" style-focus=\"outline:2px solid var(--accent);outline-offset:2px\">{{ scopeLabel }}<span style=\"font-size:10px\">▾<\u002Fspan><\u002Fbutton>\n          <span style=\"display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);font-size:13px\">All Stores · All brands<\u002Fspan>\n          <sc-if value=\"{{ scopeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:38px;left:0;z-index:5;width:340px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--sh3);padding:14px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Stores<\u002Fspan>\n                  <sc-for list=\"{{ scopeStores }}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;font-size:13px\"><span style=\"width:16px;height:16px;border-radius:4px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:11px\">{{ o.tick }}<\u002Fspan>{{ o.n }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Brands<\u002Fspan>\n                  <sc-for list=\"{{ scopeBrands }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;font-size:13px\"><span style=\"width:16px;height:16px;border-radius:4px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:11px\">{{ o.tick }}<\u002Fspan>{{ o.n }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--glass-border);padding-top:10px\"><span style=\"font-size:12px;line-height:16px;color:var(--text-2)\">Only what your role assignments allow. Entity, Site and unit lists appear when you can see more than one.<\u002Fspan><button sc-camel-on-click=\"{{ toggleScope }}\" style=\"height:30px;padding:0 12px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;cursor:pointer\">Apply<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Trust chip · as of · complete %<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--sunken);font-size:12px;color:var(--text-2)\"><span style=\"font-size:11px;color:var(--s-fg);font-weight:700\">✓<\u002Fspan>as of 23 Sep 2026, 10:42 · 100%<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--sunken);font-size:12px;color:var(--text-2)\"><span style=\"font-size:11px;color:var(--w-fg);font-weight:700\">!<\u002Fspan>as of 23 Sep 2026, 10:42 · <strong style=\"color:var(--w-fg);font-weight:600\">96% complete<\u002Fstrong><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--sunken);font-size:12px;color:var(--text-2)\"><span style=\"font-size:11px;color:var(--w-fg);font-weight:700\">!<\u002Fspan>as of 22 Sep 2026, 18:00 · <strong style=\"color:var(--w-fg);font-weight:600\">stale<\u002Fstrong><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">The tooltip names what is missing, for example “3 of 72 store days not synced”.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">My work counter<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;font-weight:500\">My work<span style=\"min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums\">12<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;font-weight:500\">My work<span style=\"min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--w-bg);color:var(--w-fg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">! 3 overdue<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;font-weight:500\">My work<span style=\"min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">99+<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text-2)\">My work<span style=\"font-size:12px;color:var(--text-3)\">0<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">The count is the tasks, approvals and exceptions assigned to you that are not yet resolved, across every persona you hold, ordered by due time and exposure. Overdue items turn the counter amber (Attention family) and add “n overdue”. Resolved work is tracked inside My work. Delegated and escalated items carry a label.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.3 · Form fields<\u002Fstrong>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap: v>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Rows are 40 px. Doc numbers are mono links. Restricted columns show a lock chip in every cell. They can't be sorted or filtered, the value is never sent to the browser, and exports leave the column out. Numbers are right-aligned with tabular figures. Selection persists across pages and filters, and the bulk bar says how many rows are selected. The header row and first column stay fixed when scrolling. With more than 1,000 rows, pages load as you go and the count reads “1–25 of 12,480”.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px\">\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n      <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.6 · Alerts &amp; toast<\u002Fstrong>\n      <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div role=\"status\" style=\"display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;border-radius:8px;background:var(--{{ a.k }}-bg);color:var(--{{ a.k }}-fg)\">\n          <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700\">{{ a.g }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-weight:600\">{{ a.t }}<\u002Fstrong><span style=\"font-size:13px;line-height:18px\">{{ a.d }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap\">{{ a.act }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"position:relative;border-radius:8px;overflow:hidden;background:var(--sunken);padding:28px 16px 16px;display:flex;justify-content:flex-end\">\n        <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--border) 0 1px,transparent 1px 12px)\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);box-shadow:var(--sh3)\"><span style=\"color:var(--s-fg);font-weight:700\">✓<\u002Fspan><span><span style=\"font-family:'Source Code Pro',monospace;font-size:13px\">PT-0098<\u002Fspan> sent for approval<\u002Fspan><span style=\"font-weight:600;color:var(--accent);text-decoration:underline\">Withdraw<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Banners sit at the top of the page or section they apply to and stay until dealt with. Toasts appear bottom-right, last 6 seconds, pause on hover and are announced politely to screen readers. Alerts are in-app for now; WhatsApp and SMS arrive in stage 5.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n      <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.7 · Empty, loading, error<\u002Fstrong>\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center\">\n        <span style=\"width:40px;height:40px;border-radius:50%;background:var(--sunken);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700\">0<\u002Fspan>\n        <strong style=\"font-weight:600\">No deliveries waiting<\u002Fstrong>\n        <span style=\"font-size:13px;color:var(--text-2);max-width:300px\">Nothing is due at BLR01, BLR02 for your brands. New supplier deliveries and incoming transfers appear here.<\u002Fspan>\n        <button style=\"height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-size:13px;font-weight:500\">View history<\u002Fbutton>\n      <\u002Fdiv>\n      <div aria-busy=\"true\" style=\"border:1px solid var(--border);border-radius:8px;overflow:hidden\">\n        <sc-for list=\"{{ skel }}\" as=\"k\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:16px 90px minmax(0,1fr) 70px 80px;gap:14px;align-items:center;height:40px;padding:0 14px;border-top:1px solid var(--border)\">\n            <span style=\"height:14px;border-radius:4px;background:var(--sunken)\"><\u002Fspan><span style=\"height:10px;border-radius:4px;background:var(--sunken)\"><\u002Fspan><span style=\"height:10px;border-radius:4px;background:var(--sunken);width:{{ k.w }}\"><\u002Fspan><span style=\"height:10px;border-radius:4px;background:var(--sunken)\"><\u002Fspan><span style=\"height:18px;border-radius:999px;background:var(--sunken)\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div role=\"alert\" style=\"border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;gap:12px;align-items:flex-start\">\n        <span style=\"width:24px;height:24px;border-radius:50%;background:var(--d-bg);color:var(--d-fg);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0\">!<\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;gap:4px;flex:1\"><strong style=\"font-weight:600\">Couldn’t load deliveries<\u002Fstrong><span style=\"font-size:13px;color:var(--text-2)\">The server didn’t respond. Your filters are kept. Reference <span style=\"font-family:'Source Code Pro',monospace\">ERR-7F3A21<\u002Fspan><\u002Fspan><\u002Fspan>\n        <button style=\"height:32px;padding:0 12px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600\">Retry<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Skeletons keep the real row height, so the page doesn’t jump when data arrives. The pulse animation is off when the device asks for reduced motion. Empty states say why the list is empty and what the user can do next.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.8 · Approval panel · approval limits<\u002Fstrong>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n      <sc-for list=\"{{ approvals }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh1);background:var(--surface);display:flex;flex-direction:column\">\n          <div style=\"padding:14px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px\">\n            <span style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><strong style=\"font-weight:600\">{{ a.title }}<\u002Fstrong><span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--i-bg);color:var(--i-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">◔<\u002Fspan>Awaiting approval<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:13px;color:var(--text-2)\">{{ a.by }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;color:var(--text-2)\">{{ a.valueLabel }}<\u002Fspan><span style=\"font-size:22px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums\">{{ a.value }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"position:relative;height:10px;border-radius:999px;background:var(--sunken);border:1px solid var(--border)\">\n                <div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ a.limitPct }};background:var(--tint);border-right:2px solid var(--accent);border-radius:999px 0 0 999px\"><\u002Fdiv>\n                <div style=\"position:absolute;top:-5px;left:{{ a.markPct }};width:4px;height:18px;margin-left:-2px;border-radius:2px;background:{{ a.markColor }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px;color:var(--text-2);font-variant-numeric:tabular-nums\"><span>₹0.00<\u002Fspan><span>Your limit up to {{ a.limit }}<\u002Fspan><span>Next: {{ a.next }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--{{ a.k }}-bg);color:var(--{{ a.k }}-fg);font-size:13px;line-height:18px\"><strong style=\"font-weight:700\">{{ a.g }}<\u002Fstrong><span>{{ a.msg }}<\u002Fspan><\u002Fdiv>\n            <span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">{{ a.policy }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--sunken);border-radius:0 0 8px 8px\">\n            <button style=\"height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-weight:500\">Reject…<\u002Fbutton>\n            <sc-if value=\"{{ a.canApprove }}\" hint-placeholder-val=\"{{ true }}\"><button style=\"height:36px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600\">Approve<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ a.escalate }}\" hint-placeholder-val=\"{{ false }}\"><button style=\"height:36px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600\">{{ a.sendLabel }}<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ a.blocked }}\" hint-placeholder-val=\"{{ false }}\"><button disabled=\"{{ true }}\" style=\"height:36px;padding:0 16px;border-radius:6px;border:1px dashed var(--control);background:var(--sunken);color:var(--text-3);font-weight:500\">Approve<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">The limit is always shown next to the approve button. Limits and the next approver come from Setup › Approval limits (policy 2) and are checked as permissions, never role or persona names; the screen never assumes the Owner. With no approver set up, the request stays pending. Whoever prepared a record can never approve it, through any persona. Approval binds to the exact version shown. Reject always asks for a reason.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.9 · Right drawer<\u002Fstrong>\n    <div style=\"position:relative;height:420px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg)\">\n      <div style=\"position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ drawerBg }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:110px minmax(0,1fr) 80px 110px;gap:12px;height:36px;align-items:center;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:13px\"><span style=\"font-family:'Source Code Pro',monospace;color:var(--accent)\">{{ b.no }}<\u002Fspan><span>{{ b.t }}<\u002Fspan><span style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ b.q }}<\u002Fspan><span style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ b.v }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:var(--scrim)\"><\u002Fdiv>\n      <div role=\"dialog\" aria-label=\"Exception\" style=\"position:absolute;top:0;right:0;bottom:0;width:420px;max-width:92%;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-left:1px solid var(--glass-border);box-shadow:var(--sh3);display:flex;flex-direction:column\">\n        <div style=\"padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:1px solid var(--glass-border)\">\n          <span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-2)\">EXC-2291 · DLV-0412<\u002Fspan><strong style=\"font-size:18px;line-height:24px;font-weight:600\">Shortage · 12 pcs<\u002Fstrong><span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--w-bg);color:var(--w-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">!<\u002Fspan>Overdue<\u002Fspan><\u002Fspan>\n          <button aria-label=\"Close\" style=\"width:36px;height:36px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-size:16px\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--glass-border)\"><span style=\"padding:10px 8px;font-weight:600;border-bottom:2px solid var(--accent)\">Details<\u002Fspan><span style=\"padding:10px 8px;color:var(--text-2)\">Evidence 2<\u002Fspan><span style=\"pa
