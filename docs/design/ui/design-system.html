d is left out of the export. Every cell records where its value came from (supplier file, GRN count, typed, calculated, confirmed mapping or AI suggestion); Show origin labels them. Suggested columns change nothing until a person accepts them. Save is explicit, and a draft is never treated as submitted. Editing a reviewed row clears its mark. Rows load 100 at a time and only visible rows are drawn; the PRD target is a 10,000-line import parsed, mapped and validated in under 1 minute.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.11 · Keyboard focus (WCAG 2.2 AA (design target) · 2.4.7, 2.4.11)<\u002Fstrong>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--bg)\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Buttons, chips, links<\u002Fspan><span style=\"display:flex;gap:12px\"><span style=\"height:36px;padding:0 16px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:600;display:flex;align-items:center;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)\">Approve<\u002Fspan><span style=\"height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-weight:500;display:flex;align-items:center;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)\">Export<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">2 px ring with a 2 px gap in the page colour; ring contrast ≥ 3:1 in both themes<\u002Fspan><\u002Fdiv>\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Table row<\u002Fspan><div style=\"border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);font-size:13px\"><div style=\"height:36px;display:flex;align-items:center;padding:0 10px;gap:10px\"><span style=\"font-family:'Source Code Pro',monospace;color:var(--accent)\">DLV-0411<\u002Fspan>Veyra<\u002Fdiv><div style=\"height:36px;display:flex;align-items:center;padding:0 10px;gap:10px;border-top:1px solid var(--border);outline:2px solid var(--accent);outline-offset:-2px;background:var(--hover)\"><span style=\"font-family:'Source Code Pro',monospace;color:var(--accent)\">DLV-0409<\u002Fspan>Linen Pro<\u002Fdiv><div style=\"height:36px;display:flex;align-items:center;padding:0 10px;gap:10px;border-top:1px solid var(--border)\"><span style=\"font-family:'Source Code Pro',monospace;color:var(--accent)\">DLV-0408<\u002Fspan>Kaaya<\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">Inset ring on the whole row; ↑↓ move, Space selects, Enter opens<\u002Fspan><\u002Fdiv>\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Grid cell<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums\"><span style=\"height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;border-right:1px solid var(--border)\">48<\u002Fspan><span style=\"height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;border-right:1px solid var(--border);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600\">3,499.00<\u002Fspan><span style=\"height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;background:var(--sunken);color:var(--text-2)\">1,749.50<\u002Fspan><\u002Fdiv><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">Read-only cells still take focus so they can be read out; they just can't be edited<\u002Fspan><\u002Fdiv>\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)\"><span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Till<\u002Fspan><span style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\"><span style=\"height:48px;border-radius:8px;border:1px solid var(--control);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600\">Cash<\u002Fspan><span style=\"height:48px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600;box-shadow:0 0 0 2px var(--bg),0 0 0 5px var(--accent)\">UPI<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--text-3)\">3 px ring, readable from arm’s length. After each action, focus goes back to the scan field.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px\">\n      <div style=\"position:relative;height:210px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)\">\n        <div style=\"position:absolute;left:0;right:0;top:0;height:44px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;z-index:2\">Top bar 56 + sticky table header 40<\u002Fdiv>\n        <div style=\"position:absolute;left:12px;right:12px;top:30px;height:32px;border-radius:4px;border:1px solid var(--border);background:var(--surface);outline:2px solid var(--d-fg);outline-offset:-2px;display:flex;align-items:center;padding:0 10px;font-size:13px;z-index:1\">Focused row, half hidden<\u002Fdiv>\n        <div style=\"position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--d-bg);color:var(--d-fg);font-size:13px;line-height:18px\"><strong>✕<\u002Fstrong><span>Wrong: a sticky bar covers the focused item (fails 2.4.11).<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:210px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)\">\n        <div style=\"position:absolute;left:0;right:0;top:0;height:44px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;z-index:2\">Top bar 56 + sticky table header 40<\u002Fdiv>\n        <div style=\"position:absolute;left:12px;right:12px;top:58px;height:32px;border-radius:4px;border:1px solid var(--border);background:var(--surface);outline:2px solid var(--accent);outline-offset:-2px;display:flex;align-items:center;padding:0 10px;font-size:13px\">Focused row, fully visible<\u002Fdiv>\n        <div style=\"position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--s-bg);color:var(--s-fg);font-size:13px;line-height:18px\"><strong>✓<\u002Fstrong><span>Right: scroll padding equals the height of the sticky bars, so focus always stops below them.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:20px;color:var(--text-2);display:flex;flex-direction:column;gap:2px\">\n      <li>Focus is never hidden: the page scroll padding is the top bar (56) plus any sticky header, and while a drawer is open the page gets right padding equal to the drawer width (420 or 640).<\u002Fli>\n      <li>Drawers and dialogs move focus inside and trap it until closed; Esc closes them and focus returns to the control that opened them. Popovers do the same.<\u002Fli>\n      <li>Toasts never take focus and never cover the focused element. They sit bottom-right and move up above an open drawer’s footer.<\u002Fli>\n      <li>The first Tab on every page shows “Skip to content” (try it on this page). Tab order follows the reading order.<\u002Fli>\n      <li>The focus ring uses the accent token (≥ 3:1 against the page and surfaces in both themes) and is never removed; a mouse click shows no ring, a keyboard move always does.<\u002Fli>\n      <li>Target size: every control is at least 24 × 24 px (2.5.8); 16 px checkboxes sit inside 40 px click areas.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.12 · My profile › Theme<\u002Fstrong>\n    <div role=\"radiogroup\" aria-label=\"Theme\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:760px\">\n      <sc-for list=\"{{ themeOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.pick }}\" role=\"radio\" aria-checked=\"{{ o.on }}\" style=\"display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px;border-radius:8px;border:{{ o.cardBd }};background:var(--surface);cursor:pointer\" style-focus=\"outline:2px solid var(--accent);outline-offset:2px\">\n          <span style=\"height:64px;border-radius:6px;border:1px solid var(--border);overflow:hidden;display:grid;grid-template-columns:1fr 1fr\"><span style=\"background:{{ o.pv1 }}\"><\u002Fspan><span style=\"background:{{ o.pv2 }}\"><\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:16px;height:16px;border-radius:50%;border:1.5px solid {{ o.rb }};display:flex;align-items:center;justify-content:center\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ o.dot }}\"><\u002Fspan><\u002Fspan><strong style=\"font-weight:600\">{{ o.n }}<\u002Fstrong><\u002Fspan>\n          <span style=\"font-size:13px;line-height:18px;color:var(--text-2)\">{{ o.d }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">The default for every new user is Match device. The choice is saved to the user, not the browser, so it follows them to other devices. The till and the shared store tablet also follow the device unless a store sets them otherwise. The theme switches instantly, with no reload, and the page never flashes the wrong theme on load.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.13 · Live action unavailable · policy gate<\u002Fstrong>\n    <div role=\"status\" style=\"display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;border-radius:8px;background:var(--w-bg);color:var(--w-fg);max-width:860px\">\n      <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700\">!<\u002Fspan>\n      <span style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-weight:600\">Live action unavailable<\u002Fstrong><span style=\"font-size:13px;line-height:18px\">Policy 16 · Offline operation is not signed yet. Missing: signature and a registered offline counter for the Store (BLR01 is a synthetic example). The pilot starts cash-first, so no tender evidence procedure is needed for it (POL-16.02).<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap\">Setup › Policy readiness<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n      <button disabled=\"{{ true }}\" title=\"Policy 16 is not signed: offline billing stays off\" style=\"height:36px;padding:0 16px;border-radius:6px;border:1px dashed var(--control);background:var(--sunken);color:var(--text-2);font-weight:500;cursor:not-allowed\">Enable offline billing<\u002Fbutton>\n      <span style=\"font-size:13px;color:var(--text-2)\">The action stays visible, disabled, with the same reason as its tooltip.<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--i-bg);color:var(--i-fg);font-size:12px;font-weight:600\"><span style=\"font-size:11px\">◔<\u002Fspan>Test data<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--text-2)\">On dev with synthetic data the action may work, with a synthetic-data banner. On kdps-test gated actions stay disabled until their policy is signed and configured, even though the data is real (DEC-071); an environment banner shows. In KDPS’s side-by-side test the earlier POS stays the system of record; Apparel OS issues no tax invoice and bills no real customer (PRD-LIF-026).<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Shown in place of any action whose KDPS policy is not signed or whose values are not configured (PRD: Required policy configuration). Design, development and tests with synthetic data go ahead; live use waits for the signed policy.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <strong style=\"font-size:16px;line-height:22px;font-weight:600\">3.14 · Several personas<\u002Fstrong>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Profile · one person, two personas<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:36px;height:36px;border-radius:50%;background:var(--sunken);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">RK<\u002Fspan><strong style=\"font-weight:600\">Ravi K.<\u002Fstrong><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ personaChips }}\" as=\"p\" hint-placeholder-count=\"2\"><span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--n-bg);color:var(--n-fg);font-size:12px;font-weight:600\"><span style=\"font-family:'Source Code Pro',monospace\">{{ p.id }}<\u002Fspan>{{ p.n }} · {{ p.scope }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Home opens first on<\u002Fspan>\n        <div role=\"radiogroup\" aria-label=\"Home opens first on\" style=\"display:flex;border:1px solid var(--control);border-radius:6px;overflow:hidden;height:32px;align-self:flex-start\">\n          <sc-for list=\"{{ homeOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.pick }}\" role=\"radio\" aria-checked=\"{{ o.on }}\" style=\"padding:0 12px;border:0;background:{{ o.bg }};color:{{ o.fg }};font-size:13px;font-weight:600;cursor:pointer\" style-focus=\"outline:2px solid var(--accent);outline-offset:-4px\">{{ o.n }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ homeBlocks }}\" as=\"b\" hint-placeholder-count=\"2\">\n          <div style=\"border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;font-weight:600\"><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;color:var(--text-2)\">{{ b.id }}<\u002Fspan> {{ b.n }} · {{ b.scope }}<\u002Fspan>\n            <sc-for list=\"{{ b.items }}\" as=\"i\" hint-placeholder-count=\"3\"><span style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)\"><span>{{ i.t }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;color:var(--text)\">{{ i.v }}<\u002Fspan><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Combined menu · each section once<\u002Fspan>\n        <div style=\"border:1px solid var(--border);border-radius:8px;overflow:hidden\">\n          <sc-for list=\"{{ comboMenu }}\" as=\"m\" hint-placeholder-count=\"11\"><div style=\"display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 12px;border-top:1px solid var(--border);font-size:13px\"><span>{{ m.n }}<\u002Fspan><span style=\"font-family:'Source Code Pro',monospace;font-size:11px;color:var(--text-2)\">{{ m.from }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)\">Actions are checked inside one assignment<\u002Fspan>\n        <sc-for list=\"{{ personaActions }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:13px;line-height:18px\">{{ a.n }}<\u002Fspan>\n            <sc-if value=\"{{ a.ok }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><button style=\"height:32px;padding:0 14px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px\">Approve<\u002Fbutton><span style=\"font-size:12px;line-height:16px;color:var(--s-fg);font-weight:600\">✓ {{ a.why }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ a.no }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><button disabled=\"{{ true }}\" style=\"height:32px;padding:0 14px;border-radius:6px;border:1px dashed var(--control);background:var(--sunken);color:var(--text-2);font-weight:500;font-size:13px;cursor:not-allowed\">Approve<\u002Fbutton><span style=\"font-size:12px;line-height:16px;color:var(--d-fg);font-weight:600\">✕ {{ a.why }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">Personas are the PRD’s 14 kinds of work, each with an ID (P-OWN … P-AUD). A person can hold several, but a persona grants nothing: only role assignments do, each inside its own scope. One login and one My work cover every persona. The menu is the union of what the assignments grant; Home shows one block per persona, in the order the person picks. Whoever prepared a record can never approve it through another persona.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"shells\" style=\"display:flex;flex-direction:column;gap:32px;scroll-margin-top:80px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h2 style=\"margin:0;font-size:24px;line-height:30px;font-weight:600\">4 · Shells<\u002Fh2>\n    <p style=\"margin:0;color:var(--text-2);max-width:820px\">Back office, Till, Portal and Mobile at their desi mel-on-click=\"{{ toggleDrawer }}\" style=\"position:absolute;right:20px;bottom:20px;height:36px;padding:0 14px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;z-index:1\">Open approval drawer<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">The top bar is 56 px of glass, and content scrolls underneath it. The sidebar is solid (232 px, collapses to 64 px) and shows only the sections the user’s role assignments grant, across all their personas, with open-item counts. The page header has the breadcrumb, title, status, scope chip and one primary action. Below 1024 px the sidebar becomes a drawer and the header actions go into a “More” menu.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">4B · Till · 1366 × 768 · all solid<\u002Fh3>\n    <div role=\"radiogroup\" aria-label=\"Till state\" style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:600;color:var(--text-2);margin-right:4px\">Show the till as<\u002Fspan>\n      <sc-for list=\"{{ tillModes }}\" as=\"m\" hint-placeholder-count=\"6\"><button sc-camel-on-click=\"{{ m.pick }}\" role=\"radio\" aria-checked=\"{{ m.on }}\" style=\"height:32px;padding:0 12px;border-radius:999px;border:1px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }};font-size:13px;font-weight:600;cursor:pointer\" style-focus=\"outline:2px solid var(--accent);outline-offset:2px\">{{ m.n }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto;border-radius:10px;border:1px solid var(--border);box-shadow:var(--sh2)\">\n      <div style=\"width:1366px;height:768px;background:var(--bg);display:flex;flex-direction:column;font-size:15px;line-height:22px\">\n        <div style=\"height:52px;flex- :var(--text-2)\">Add customer (name, mobile)<span style=\"font-family:'Source Code Pro',monospace;font-size:12px;border:1px solid var(--border);border-radius:4px;padding:0 6px\">F2<\u002Fspan><\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-variant-numeric:tabular-nums\">\n              <span style=\"color:var(--text-2)\">5 pieces · MRP<\u002Fspan><span>₹14,796.00<\u002Fspan>\n              <span style=\"color:var(--text-2)\">Offers<\u002Fspan><span style=\"color:var(--s-fg)\">−₹1,947.00<\u002Fspan>\n              <span style=\"color:var(--text-2)\">Includes GST<\u002Fspan><span style=\"color:var(--text-2)\">{{ tillGst }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:16px;font-weight:600\">To pay<\u002Fspan><span style=\"font-size:40px;line-height:44px;font-weight:700;font-variant-numeric:tabular-nums\">₹12,849.00<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n              <sc-for list=\"{{ tenders }}\" as=\"t\" hint-placeholder-count=\"8\">\n                <span style=\"height:52px;border:1px solid {{ t.bd }};border-radius:8px;background:{{ t.bg }};color:{{ t.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;line-height:18px;text-align:center\">{{ t.n }}<sc-if value=\"{{ t.hasSub }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;line-height:14px;font-weight:500\">{{ t.sub }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 12px;border-radius:8px;background:var(--sunken);font-variant-numeric:tabular-nums;font-size:14px\">\n              <span style=\"color:var(--text-2)\">Cash received<\u002Fspan><span style=\"font-weight:600\">₹13,000.00<\u002Fspan>\n              <span style=\"color:var(--text-2)\">Change<\u002Fspan><span style=\"font-weight:600\">₹151.00<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"flex:1\"><\u002Fspan>\n            <sc-if value=\"{{ till.canPay }}\" hint-placeholder-val=\"{{ true }}\"><button style=\"height:64px;width:100%;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px\">Pay ₹12,849.00<span style=\"font-family:'Source Code Pro',monospace;font-size:13px;border:1px solid var(--on-accent);border-radius:4px;padding:0 6px\">F12<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ till.pay }}\" hint-placeholder-val=\"{{ false }}\"><button disabled=\"{{ true }}\" style=\"height:64px;width:100%;border-radius:8px;border:1px dashed var(--control);background:var(--sunken);color:var(--text-2);font-size:18px;font-weight:600\">{{ till.pay }}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:52px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 18px;background:var(--sunken);border-top:1px solid var(--border);font-size:14px\">\n          <sc-for list=\"{{ fkeys }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <span style=\"display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:6px;background:{{ f.bg }};border:{{ f.bd }};color:{{ f.fg }}\"><span style=\"font-family:'Source Code Pro',monospace;font-size:12px;font-weight:500;border:1px solid var(--control);border-radius:4px;padding:0 5px\">{{ f.k }}<\u002Fspan>{{ f.n }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:var(--text-3)\">No glass and no sidebar. The scan field always has focus and takes a piece ID or a supplier barcode. A piece-tracked line lists each scanned piece ID under the SKU, so returns and counts stay at piece level (sample IDs shown); every action has a function key, and focus returns to the scan field after each one. Targets are at least 48 px and Pay is 64 px. A Store can run several online tills, but only its one registered offline counter bills without a connection, under offline authority renewed online every 24 hours (policy 16). The connection state is always visible. Pay is blocked, with a banner saying why, while billing is paused, when offline authority expires, when the cached working set expires (PRD-OFF-004), and on an online till that loses its connection. A full disk, a wrong clock, a second open tab or an app update also stops new bills with a banner; a finished bill is never lost. Tender tiles show only the tenders enabled under policy 7; offline, only cash, plus card or UPI where policy 16’s evidence procedure is set up. Returns need a connection. Manager approval (F7) means the manager signs in with their own login; there are no PINs. It needs a connection, so F7 is greyed “online only” while the till is offline and a bill that needs it cannot be finalised offline (PRD-OFF-016).<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <h3 style=\"margin:0;font-size:18px;line-height:24px;font-weight:600\">4C · Portal · Self-service on the shared store tablet · 1180 × 820<\u002Fh3>\n    <div style=\"overflow-x:auto;border-radius:10px;border:1px solid var(--border);box-shadow:var(--sh2)\">\n      <div style=\"width:1180px;height:820px;position:relative;background:var(--bg);overflow:hidden;font-size:15px;line-height:22px\">\n        <div style=\"position:absolute;inset:0;padding:88px 40px 32px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-content:start\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;grid-column:span 2\">\n            <span style=\"font-siz
