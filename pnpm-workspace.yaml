packages:
  - apps/*
  - packages/*

# One version of each shared tool across the workspace.
catalog:
  # typescript-eslint 8.71 supports TypeScript below 6.1, so TypeScript stays on 6.0 for now.
  typescript: ~6.0.3
  vitest: ^5.0.3
  '@types/node': ^22.20.5

# Dependency build scripts are blocked unless listed here. None is needed yet. These three come with
# Testcontainers (ssh2 and cpu-features are optional native speed-ups; protobufjs only prints a notice).
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
